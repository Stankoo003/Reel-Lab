spring:
  application:
    name: reellab-server

  datasource:
    # No literals here on purpose: every credential comes from the environment,
    # and .env is gitignored.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` makes entities and migrations disagree
      # loudly at startup instead of letting Hibernate quietly "fix" the schema
      # behind Flyway's back.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    # Mailpit, from docker compose. Accepts everything, delivers nothing, and shows it on
    # http://localhost:8025 — a real mailbox for local work with no real recipient.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Mailpit wants neither, and asking for them turns a working local setup into an
    # authentication error.
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 300MB

springdoc:
  # Puts /actuator/health into the published contract. Without this the client's
  # health call would have to be untyped, which defeats generating the client.
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

reellab:
  auth:
    # No default. A signing key shipped in the repository is not a secret, and an app that
    # starts without one would issue tokens anybody could forge — failing to start is the
    # louder and safer of the two failures.
    secret: ${JWT_SECRET}
    # No refresh token, so this is also how long a sign-in lasts before the app asks again.
    ttl: 30d
  mail:
    # smtp → Mailpit locally (or any relay); resend → the deployed environment.
    # Everything that sends mail depends on the Mailer interface and cannot tell which.
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:ReelLab <no-reply@reellab.dev>}
    # Only read when provider is resend. Absent locally, and that is not an error.
    resend-api-key: ${RESEND_API_KEY:}
    # Where a reset link points. The server's own public URL — see ResetPageController for
    # why the email cannot link straight to the app's scheme.
    web-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  password-reset:
    # Long enough to survive a mail queue and someone who reads email in an hour; short
    # enough that a link left in an inbox stops being a key by the afternoon.
    ttl: ${PASSWORD_RESET_TTL:45m}
    # Per address, and per host, within the window below.
    per-email-limit: ${PASSWORD_RESET_EMAIL_LIMIT:3}
    per-ip-limit: ${PASSWORD_RESET_IP_LIMIT:10}
    window: ${PASSWORD_RESET_WINDOW:15m}
    # The request endpoint always takes this long. See PasswordResetService.
    response-floor: ${PASSWORD_RESET_FLOOR:250ms}
  messaging:
    # Per user per window, not per conversation: the abuse this stops is one account firing
    # at anybody, and a per-thread limit would let it fire at ten people at ten times the rate.
    send-limit: ${DM_SEND_LIMIT:20}
    send-window: ${DM_SEND_WINDOW:1m}
    page-size: ${DM_PAGE_SIZE:30}
  media:
    # The database stores relative paths only; this base is prepended when
    # building responses, so swapping CDN host is a config change.
    cdn-base-url: ${MEDIA_CDN_BASE_URL:http://localhost:8080/media}
    storage:
      # Where uploaded bytes land. Defaults to the repo's media/ directory, which is
      # what the local media host serves — so an upload is playable immediately.
      directory: ${MEDIA_STORAGE_DIR:../media}
      max-bytes: ${MEDIA_MAX_BYTES:268435456}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # Seed lives in its own location so it can never reach a real deployment
    # through a migration that runs everywhere.
    locations: classpath:db/migration, classpath:db/seed
    # The seed is numbered V900 so it always sorts last, which means every real
    # migration added later is "out of order" relative to a dev database that has
    # already been seeded. Allowed here and only here — production has no seed, so
    # its migrations stay strictly ordered.
    out-of-order: true
