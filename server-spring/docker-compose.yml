services:
  postgres:
    image: postgres:17-alpine
    container_name: reellab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reellab-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app starts separately, so this is what tells you the DB is actually
      # ready to accept the Flyway connection rather than merely running.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local email. Mailpit accepts every message on :1025 and delivers none of them —
  # they land in a web mailbox on :8025 instead. That is what makes it possible to click a
  # real password-reset link during development without a real address, a verified domain,
  # or any chance of mailing a stranger from a test run.
  #
  # Nothing about the app knows it is here: the app talks to the Mailer interface, and
  # `reellab.mail.provider` decides that this is what is behind it. Deployed, that value is
  # `resend` and no code differs.
  mailpit:
    image: axllent/mailpit:latest
    container_name: reellab-mailpit
    restart: unless-stopped
    ports:
      # SMTP in, for the server.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      # The mailbox, for you: http://localhost:8025
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      # Messages live in memory and go when the container does. A dev mailbox that
      # accumulates across weeks is a mailbox nobody reads.
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reellab-pgdata:
