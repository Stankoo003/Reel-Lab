services:
  postgres:
    image: postgres:17-alpine
    container_name: reellab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reellab-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app starts separately, so this is what tells you the DB is actually
      # ready to accept the Flyway connection rather than merely running.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reellab-pgdata:
